[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "size-compressor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "maxapi>=1.0.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
]
# dependencies = [...]

[tool.setuptools.packages.find]
where = ["src"]

# а вот тут — «команда» для запуска приложения
[project.scripts]
start = "app.main:main"

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
]
